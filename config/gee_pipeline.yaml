PIPELINE_PARAMS:
  YEAR: 2020
  OUTPUT_RESOLUTION: 100 # in meters
  CAST_TO_INT16: TRUE
  VARIABLE: 'fapar'
  ENSEMBLE_SIZE: 5 
  EXPORT_BANDS: ['mean', 'stdDev', 'count', 'stdDev_within', 'stdDev_across'] # which bands to export (for 20m resolution, mean is always exported, stdDev, count, stdDev_within and stdDev_across are only exported if EXPORT_STD_FOR_20m is set to TRUE)
  # EXPORT_BANDS: ['mean', 'stdDev']
  MODEL_VERSION: 'v02' # version of the model to be used (describes trained model version)
  EXPORT_VERSION: 'v03' # version of the export to be used (describes pipeline parameters / cloud filtering / image selection strategy etc.)

# MODEL-Versioning:
# v01: initial submission (v01) / each observation predicted with single randomly assigned ensemble member
# v02: updated model v02 trained using GROUNDED-EO RMs / predict each observation with full ensemble instead of single randomly assigned ensemble member

# Export-Versioning:
# v01: initial submission (MAX_IMAGES_PER_GROUP: 8, VI_INDEX: 'NDVI', MAX_VI_DIFFERENCE: 0.2, VI_MAX_PERCENTILE: 0.95)
# v02: (MAX_IMAGES_PER_GROUP: 4, VI_INDEX: 'NDVI', MAX_VI_DIFFERENCE: 0.15, VI_MAX_PERCENTILE: 0.95)
# v03: # dynamically choose between 4 (MIN_IMAGES_PER_GROUP) and 8 (MAX_IMAGES_PER_GROUP) depending on cloudiness of a region: more cloudy on average --> more s2 images as input
# (MIN_IMAGES_PER_GROUP: 4, MAX_IMAGES_PER_GROUP: 8, VI_INDEX: 'NDVI', MAX_VI_DIFFERENCE: 0.15, VI_MAX_PERCENTILE: 0.95)

EXPORT_PARAMS: # used for exporting the final trait maps outside from GEE Assets as single global mosaics either to GEE Drive or GEE Assets (not the exports crs for asset --> Local UTMs by default)
  EPSG: 'EPSG:4326'
  NO_DATA_VALUE_MEAN: -9999
  NO_DATA_VALUE_STDDEV: -9999
  NO_DATA_VALUE_COUNT: 255

CLAMP_PREDICTIONS: # will be converted to tuple in config.py / idea first mask predicitons to avoid unrealistic retrievals, than clamp to 0-1 range. 
  laie: [0.0, 8.0]
  fapar: [0.0, 1.0] # we allow slightly higher and lower values for FCVOER and FAPAR; a prediction of -0.001 in a desert is still realistic. 
  fcover: [0.0, 1.0]

MASK_RANGE: # range to mask predictions before clamping (e.g. for fapar, we can mask all values < -0.1 and > 1.1 to avoid unrealistic retrievals, but still allow slightly higher and lower values for FCVOER and FAPAR; a prediction of -0.001 in a desert is still realistic.)
  laie: [-0.1, 8.1]
  fapar: [-0.05, 1.05]
  fcover: [-0.05, 1.05]

S2_FILTERING:
  MIN_IMAGES_PER_GROUP: 4 # min number of images to be used for images from the same orbit and tile (for normal conditions)
  MAX_IMAGES_PER_GROUP: 8 # max number of images to be used for images from the same orbit and tile (in case of very cloudy conditions)
  VI_INDEX: 'NDVI' # 'EVI' or 'NDVI', bad results with EVI due to high values in some snow covered areas
  MAX_VI_DIFFERENCE: 0.15 # max difference in EVI for images, taking all images with MAX_EVI_DIFFERENCE to the VI_MAX_PERCENTILE of EVI values
  VI_MAX_PERCENTILE: 0.95 # max percentile of EVI values to be used for filtering images

INT16_SCALING: 
  lai_mean: 1000
  lai_stdDev: 1000
  laie_mean: 1000
  laie_stdDev: 1000
  fapar_mean: 10000
  fapar_stdDev: 10000
  fcover_mean: 10000
  fcover_stdDev: 10000

UNITS: 
  lai_mean: '[m2/m2]'
  laie_mean: '[m2/m2]'
  lai_stdDev: '[m2/m2]'
  laie_stdDev: '[m2/m2]'
  fapar_mean: '[]'
  fapar_stdDev: '[]'
  fcover_mean: '[]'
  fcover_stdDev: '[]'

CLOUD_FILTERING:
  CLOUDY_PIXEL_PERCENTAGE: 70 # max initial cloudy pixel percentage
  CLOUD_SCORE_PLUS_THRESHOLD: 0.65
  CLOUD_SCORE_PLUS_BAND: 'cs' # 'cs' or 'cs_cdf' : see https://medium.com/google-earth/all-clear-with-cloud-score-bd6ee2e2235e

GEE_FOLDERS:
  ASSET_FOLDER: 'projects/ee-speckerfelix/assets/open-earth'
  TEMP_FOLDER: 'projects/ee-speckerfelix/assets/temp'

GDRIVE_FOLDERS:
  TEMP_FOLDER: 'felix_oemc_exports'

